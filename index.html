<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI 표준어·방언 판별기</title>
  <style>
    :root{
      /* 첨부된 화면 기준 Google Apps Script 안내 상단바 높이입니다.
         안내 바가 1~2px 남으면 59~60으로, 앱 상단이 잘리면 56~57로 조정하세요. */
      --gas-banner-crop:58px;
      --bg:#f5f7fb;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}
    body{font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

    /* Apps Script 페이지 전체를 58px 위로 올리고, 바깥 영역을 잘라 냅니다.
       iframe 내부 DOM을 수정하는 방식이 아니므로 교차 출처 보안 정책에도 걸리지 않습니다. */
    .viewport{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
    #gasFrame{
      position:absolute;
      left:0;
      top:calc(-1 * var(--gas-banner-crop));
      width:100%;
      height:calc(100% + var(--gas-banner-crop));
      border:0;
      display:block;
      background:var(--bg);
    }

    .loading{
      position:fixed;inset:0;display:grid;place-items:center;z-index:10;
      background:linear-gradient(180deg,#eef3ff,#f7f9fc);color:#475467;
      transition:opacity .2s ease,visibility .2s ease;
    }
    .loading.hide{opacity:0;visibility:hidden;pointer-events:none}
    .loading-box{text-align:center;font-size:14px;line-height:1.6}
    .spinner{width:34px;height:34px;margin:0 auto 12px;border:4px solid #dfe5f5;border-top-color:#3859e8;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .setup{
      display:none;position:fixed;inset:0;z-index:20;place-items:center;padding:24px;
      background:#f7f9fc;color:#1d2433;
    }
    .setup.show{display:grid}
    .setup-card{width:min(720px,100%);background:#fff;border:1px solid #e4e8f0;border-radius:20px;padding:26px;box-shadow:0 16px 45px rgba(26,38,70,.1)}
    .setup h1{margin:0 0 12px;font-size:24px}.setup p{line-height:1.7;color:#667085}.setup code{word-break:break-all;background:#f3f5f8;padding:2px 5px;border-radius:6px}
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <div class="loading-box"><div class="spinner"></div>AI 표준어·방언 판별기를 불러오는 중...</div>
  </div>

  <div class="viewport">
    <iframe
      id="gasFrame"
      title="AI 표준어·방언 판별기"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>

  <section id="setup" class="setup">
    <div class="setup-card">
      <h1>Apps Script 웹앱 주소를 설정해 주세요.</h1>
      <p><code>app.html</code> 파일의 <code>GAS_WEB_APP_URL</code> 값에 현재 배포된 Apps Script의 <code>/exec</code> 주소를 넣으면 됩니다.</p>
      <p>예: <code>https://script.google.com/macros/s/AKfycb.../exec</code></p>
    </div>
  </section>

<script>
(() => {
  /* ============================================================
     ★ 이 한 줄만 본인의 Apps Script /exec 주소로 바꾸세요.
     ============================================================ */
  const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzZPkZPS82mikpnX5pZwlB_eon-vAvA4svvzrObYLlDIIVLH3lDYkoGW3IMKI2yL9Ii/exec';

  const frame = document.querySelector('#gasFrame');
  const loading = document.querySelector('#loading');
  const setup = document.querySelector('#setup');

  // 필요할 때 URL의 ?gas=... 값으로 임시 테스트할 수도 있습니다.
  const qs = new URLSearchParams(location.search);
  const queryUrl = qs.get('gas') || '';
  const gasUrl = queryUrl || GAS_WEB_APP_URL;

  // ?crop=60처럼 호출하면 상단바 잘라내기 높이를 임시 조정할 수 있습니다.
  const crop = Number(qs.get('crop'));
  if (Number.isFinite(crop) && crop >= 0 && crop <= 100) {
    document.documentElement.style.setProperty('--gas-banner-crop', crop + 'px');
  }

  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:[?#].*)?$/.test(gasUrl)) {
    loading.classList.add('hide');
    setup.classList.add('show');
    return;
  }

  frame.src = gasUrl;
  frame.addEventListener('load', () => {
    // Apps Script 내부 앱이 완전히 그려질 시간을 조금 주고 로딩 화면을 제거합니다.
    setTimeout(() => loading.classList.add('hide'), 250);
  });

  // index.html이 준비 완료 메시지를 보내면 더 빨리 로딩 화면을 닫습니다.
  window.addEventListener('message', event => {
    if (event.data && event.data.type === 'DIALECT_APP_READY') {
      loading.classList.add('hide');
    }
  });
})();
</script>
</body>
</html>
